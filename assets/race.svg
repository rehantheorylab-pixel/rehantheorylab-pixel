<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-label="Illustration: several engines racing to solve one problem">
  <style>
    .h    { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 3.2px; fill: #e6edf3; }
    .lab  { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 12px; fill: #8b949e; }
    .labw { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 12px; font-weight: 700; fill: #e6edf3; }
    .cap  { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; font-size: 10.5px; letter-spacing: .8px; fill: #6e7681; }

    /* Bars never start empty — legible at frame 0 and at every loop restart. */
    @keyframes run { from { transform: scaleX(0.12); } to { transform: scaleX(1); } }
    @keyframes win { 0%, 18% { opacity: .0; } 30%, 100% { opacity: 1; } }
    @keyframes breathe { 0%, 100% { opacity: .12; } 50% { opacity: .34; } }

    .bar   { transform-box: fill-box; transform-origin: left center; }
    .b1    { animation: run 6.4s cubic-bezier(.15,.85,.25,1) infinite both; }
    .b2    { animation: run 5.2s cubic-bezier(.15,.85,.25,1) infinite both; }
    .b3    { animation: run 4.1s cubic-bezier(.15,.85,.25,1) infinite both; }
    .b4    { animation: run 3.2s cubic-bezier(.15,.85,.25,1) infinite both; }
    .b5    { animation: run 2.3s cubic-bezier(.15,.85,.25,1) infinite both; }
    .b6    { animation: run 1.5s cubic-bezier(.15,.85,.25,1) infinite both; }
    .badge { animation: win 6.4s ease-out infinite both; }
    .grid  { animation: breathe 5s ease-in-out infinite; }
  </style>

  <defs>
    <linearGradient id="winner" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#a371f7"/>
    </linearGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1" fill="#21262d"/>
    </pattern>
    <clipPath id="frame">
      <rect x="0" y="0" width="1000" height="430" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="430" fill="#0d1117"/>
    <rect width="1000" height="430" fill="url(#dots)" class="grid"/>

    <text x="40" y="46" class="h">ENGINE RACE</text>
    <text x="40" y="66" class="cap">every problem goes to every engine at once &#183; first to finish wins &#183; the winner is reported</text>

    <line x1="920" y1="84" x2="920" y2="358" stroke="#30363d" stroke-width="1.5" stroke-dasharray="5 5"/>

    <text x="270" y="108" text-anchor="end" class="lab">BCJ</text>
    <rect x="290" y="95"  width="630" height="20" rx="5" fill="#161b22"/>
    <rect x="290" y="95"  width="630" height="20" rx="5" fill="#484f58" class="bar b1"/>

    <text x="270" y="151" text-anchor="end" class="lab">Schroeppel&#8211;Shamir</text>
    <rect x="290" y="138" width="630" height="20" rx="5" fill="#161b22"/>
    <rect x="290" y="138" width="630" height="20" rx="5" fill="#575d66" class="bar b2"/>

    <text x="270" y="194" text-anchor="end" class="lab">meet-in-the-middle</text>
    <rect x="290" y="181" width="630" height="20" rx="5" fill="#161b22"/>
    <rect x="290" y="181" width="630" height="20" rx="5" fill="#6e7681" class="bar b3"/>

    <text x="270" y="237" text-anchor="end" class="lab">BigUint paths</text>
    <rect x="290" y="224" width="630" height="20" rx="5" fill="#161b22"/>
    <rect x="290" y="224" width="630" height="20" rx="5" fill="#8b949e" class="bar b4"/>

    <text x="270" y="280" text-anchor="end" class="lab">adaptive partitioning</text>
    <rect x="290" y="267" width="630" height="20" rx="5" fill="#161b22"/>
    <rect x="290" y="267" width="630" height="20" rx="5" fill="#b1bac4" class="bar b5"/>

    <text x="270" y="323" text-anchor="end" class="labw">GDEP</text>
    <rect x="290" y="310" width="630" height="20" rx="5" fill="#161b22"/>
    <rect x="290" y="310" width="630" height="20" rx="5" fill="url(#winner)" class="bar b6"/>
    <circle cx="920" cy="320" r="4.5" fill="#58a6ff"/>

    <g class="badge">
      <rect x="933" y="310" width="48" height="20" rx="4" fill="#58a6ff"/>
      <text x="957" y="324" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.4" fill="#0d1117">WON</text>
    </g>

    <text x="40" y="392" class="cap">Illustrative animation, not a measurement. Real results, hardware and caveats:</text>
    <text x="40" y="409" class="cap">github.com/rehantheorylab-pixel/zpp-subset-sum-solver</text>

    <rect x="0.5" y="0.5" width="999" height="429" rx="16" fill="none" stroke="#30363d"/>
  </g>
</svg>
