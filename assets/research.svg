<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="290" viewBox="0 0 1000 290" role="img" aria-label="Research areas: exact search, kernel memory, agent access">
  <style>
    .h    { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; font-size: 12.5px; font-weight: 700; letter-spacing: 2.6px; fill: #e6edf3; }
    .b    { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; font-size: 12px; fill: #8b949e; }
    .n    { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 11px; font-weight: 700; letter-spacing: 1px; fill: #58a6ff; }

    @keyframes travel { 0% { transform: translateX(0); opacity: 0; } 12% { opacity: 1; } 88% { opacity: 1; } 100% { transform: translateX(840px); opacity: 0; } }
    @keyframes breathe { 0%, 100% { opacity: .12; } 50% { opacity: .34; } }
    @keyframes rim { 0%, 100% { stroke: #30363d; } 50% { stroke: #58a6ff; } }

    .pulse { animation: travel 4.6s cubic-bezier(.4,0,.6,1) infinite; }
    .grid  { animation: breathe 5s ease-in-out infinite; }
    .r1    { animation: rim 5.2s 0s   ease-in-out infinite; }
    .r2    { animation: rim 5.2s 1.1s ease-in-out infinite; }
    .r3    { animation: rim 5.2s 2.2s ease-in-out infinite; }
  </style>

  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#a371f7"/>
    </linearGradient>
    <linearGradient id="railDim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#58a6ff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#a371f7" stop-opacity="0.28"/>
    </linearGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1" fill="#1c2128"/>
    </pattern>
    <clipPath id="frame"><rect x="0" y="0" width="1000" height="290" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="290" fill="#0d1117"/>
    <rect width="1000" height="290" fill="url(#dots)" class="grid"/>

    <text x="40" y="42" class="n">RESEARCH</text>
    <line x1="128" y1="38" x2="960" y2="38" stroke="#21262d" stroke-width="1"/>

    <!-- connector rail + travelling pulse -->
    <line x1="80" y1="86" x2="920" y2="86" stroke="url(#railDim)" stroke-width="2"/>
    <circle cx="80" cy="86" r="3.5" fill="url(#acc)" class="pulse"/>

    <!-- card 1 -->
    <rect x="40" y="108" width="288" height="150" rx="10" fill="#0d1117" stroke="#30363d" class="r1"/>
    <circle cx="72" cy="140" r="11" fill="none" stroke="url(#acc)" stroke-width="1.6"/>
    <text x="72" y="144" text-anchor="middle" class="n">1</text>
    <text x="94" y="145" class="h">EXACT SEARCH</text>
    <text x="64" y="176" class="b">NP-complete instances solved exactly,</text>
    <text x="64" y="196" class="b">faster — by racing engines against</text>
    <text x="64" y="216" class="b">each other, not trusting one.</text>

    <!-- card 2 -->
    <rect x="356" y="108" width="288" height="150" rx="10" fill="#0d1117" stroke="#30363d" class="r2"/>
    <circle cx="388" cy="140" r="11" fill="none" stroke="url(#acc)" stroke-width="1.6"/>
    <text x="388" y="144" text-anchor="middle" class="n">2</text>
    <text x="410" y="145" class="h">KERNEL MEMORY</text>
    <text x="380" y="176" class="b">Allocators and page management</text>
    <text x="380" y="196" class="b">inside a real RISC-V kernel —</text>
    <text x="380" y="216" class="b">lock-free, arena, slab.</text>

    <!-- card 3 -->
    <rect x="672" y="108" width="288" height="150" rx="10" fill="#0d1117" stroke="#30363d" class="r3"/>
    <circle cx="704" cy="140" r="11" fill="none" stroke="url(#acc)" stroke-width="1.6"/>
    <text x="704" y="144" text-anchor="middle" class="n">3</text>
    <text x="726" y="145" class="h">AGENT ACCESS</text>
    <text x="696" y="176" class="b">Letting an AI agent operate the</text>
    <text x="696" y="196" class="b">user's own machine, with consent</text>
    <text x="696" y="216" class="b">as a first-class constraint.</text>

    <rect x="0.5" y="0.5" width="999" height="289" rx="16" fill="none" stroke="#30363d"/>
  </g>
</svg>
