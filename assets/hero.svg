<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-label="Rehan Muhammad — Independent Researcher">
  <style>
    .name  { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; font-size: 46px; font-weight: 700; letter-spacing: 7px; fill: #e6edf3; }
    .sub   { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; font-size: 12.5px; font-weight: 700; letter-spacing: 4.2px; fill: #9ba3ae; }
    .tag   { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; font-size: 13px; letter-spacing: 1.2px; fill: #8b949e; }
    .mono  { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 11.5px; letter-spacing: .6px; fill: #58a6ff; }

    /* Only decorative layers animate. Text is opaque at frame 0, always legible. */
    @keyframes sweep   { from { transform: translateX(-520px); } to { transform: translateX(1080px); } }
    @keyframes breathe { 0%, 100% { opacity: .14; } 50% { opacity: .40; } }
    @keyframes blink   { 0%, 45% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes glow    { 0%, 100% { opacity: .22; } 50% { opacity: .62; } }

    .grid  { animation: breathe 5s ease-in-out infinite; }
    .shine { animation: sweep 5.5s linear infinite; }
    .caret { animation: blink 1.15s steps(1) infinite; }
    .orb   { animation: glow 4.5s ease-in-out infinite; }
    .orb2  { animation: glow 4.5s 1.4s ease-in-out infinite; }
  </style>

  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#58a6ff"/>
      <stop offset="50%"  stop-color="#a371f7"/>
      <stop offset="100%" stop-color="#58a6ff"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#58a6ff" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo2" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#a371f7" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#a371f7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1" fill="#30363d"/>
    </pattern>
    <clipPath id="frame">
      <rect x="0" y="0" width="1000" height="250" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="250" fill="#0d1117"/>
    <rect width="1000" height="250" fill="url(#dots)" class="grid"/>
    <circle cx="150" cy="46" r="150" fill="url(#halo)"  class="orb"/>
    <circle cx="858" cy="212" r="160" fill="url(#halo2)" class="orb2"/>

    <text x="500" y="104" text-anchor="middle" class="name">REHAN MUHAMMAD</text>

    <rect x="330" y="122" width="340" height="2" rx="1" fill="url(#accent)"/>

    <text x="500" y="152" text-anchor="middle" class="sub">INDEPENDENT&#160;&#160;RESEARCHER</text>
    <text x="500" y="180" text-anchor="middle" class="tag">Exact algorithms &#183; Systems programming &#183; Agent infrastructure</text>

    <text x="500" y="216" text-anchor="middle" class="mono">49 engines raced&#160;&#160;&#183;&#160;&#160;1,649&#215; measured&#160;&#160;&#183;&#160;&#160;3 allocators in a RISC-V kernel</text>
    <rect x="757" y="206" width="7" height="12" fill="#58a6ff" class="caret"/>

    <rect x="-520" y="0" width="520" height="250" fill="url(#shine)" class="shine"/>
    <rect x="0.5" y="0.5" width="999" height="249" rx="16" fill="none" stroke="#30363d"/>
  </g>
</svg>
